<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Number Game</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
  }
  .game-card {
    background: #fff;
    border-radius: 1rem;
    padding: 2.5rem;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
  }
  .game-card h1 {
    font-size: 1.8rem;
    font-weight: 700;
    color: #2575fc;
  }
  #message {
    min-height: 40px;
    font-weight: 600;
  }
  #attempts-list span {
    display: inline-block;
    background: #eef1ff;
    color: #333;
    padding: 3px 10px;
    border-radius: 20px;
    margin: 2px;
    font-size: 0.85rem;
  }
  .btn-primary {
    background-color: #2575fc;
    border: none;
  }
  .btn-primary:hover {
    background-color: #6a11cb;
  }
</style>
</head>
<body>

<div class="game-card text-center">
  <h1 class="mb-2">🎯 Guess the Number</h1>
  <p class="text-muted mb-4">I'm thinking of a number between <strong>1</strong> and <strong>100</strong>. Can you guess it?</p>

  <div class="input-group mb-3">
    <input type="number" id="guessInput" class="form-control" placeholder="Enter your guess" min="1" max="100">
    <button class="btn btn-primary" id="guessBtn">Guess</button>
  </div>

  <div id="message" class="mb-3 text-primary"></div>

  <div class="d-flex justify-content-between mb-3">
    <span class="badge bg-secondary">Attempts: <span id="attemptCount">0</span></span>
    <button class="btn btn-outline-secondary btn-sm" id="resetBtn">Reset Game</button>
  </div>

  <div id="attempts-list" class="text-start"></div>
</div>

<script>
  let randomNumber = Math.floor(Math.random() * 100) + 1;
  let attempts = 0;

  const guessInput = document.getElementById('guessInput');
  const guessBtn = document.getElementById('guessBtn');
  const resetBtn = document.getElementById('resetBtn');
  const message = document.getElementById('message');
  const attemptCount = document.getElementById('attemptCount');
  const attemptsList = document.getElementById('attempts-list');

  function checkGuess() {
    const guess = parseInt(guessInput.value);

    if (isNaN(guess) || guess < 1 || guess > 100) {
      message.textContent = "⚠️ Please enter a valid number between 1 and 100.";
      message.className = "mb-3 text-warning";
      return;
    }

    attempts++;
    attemptCount.textContent = attempts;

    if (guess === randomNumber) {
      message.textContent = `🎉 Correct! The number was ${randomNumber}. You got it in ${attempts} attempts!`;
      message.className = "mb-3 text-success";
      guessBtn.disabled = true;
      guessInput.disabled = true;
    } else if (guess < randomNumber) {
      message.textContent = "📈 Too low! Try a higher number.";
      message.className = "mb-3 text-info";
    } else {
      message.textContent = "📉 Too high! Try a lower number.";
      message.className = "mb-3 text-danger";
    }

    const span = document.createElement('span');
    span.textContent = guess;
    attemptsList.appendChild(span);

    guessInput.value = '';
    guessInput.focus();
  }

  guessBtn.addEventListener('click', checkGuess);
  guessInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') checkGuess();
  });

  resetBtn.addEventListener('click', () => {
    randomNumber = Math.floor(Math.random() * 100) + 1;
    attempts = 0;
    attemptCount.textContent = 0;
    message.textContent = '';
    attemptsList.innerHTML = '';
    guessInput.disabled = false;
    guessBtn.disabled = false;
    guessInput.value = '';
    guessInput.focus();
  });
</script>

</body>
</html>
